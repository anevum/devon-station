name: Recovered server verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
  workerd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix workerd-test --ignore-scripts --no-audit --no-fund
      - run: npm test --prefix workerd-test
  unified-application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: python -m pip install -r requirements-browser.txt
      - run: npm run build
      - run: npm run verify:privacy
      - run: npm run test:runtime:dom
      - run: npm run test:runtime:browser
        env:
          DS_CHROME: /usr/bin/google-chrome
      - run: npm run test:browser
        env:
          DS_CHROME: /usr/bin/google-chrome
