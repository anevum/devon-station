name: DS011 Mail release-control source review
on:
  pull_request:
    paths:
      - '.github/workflows/mail-acceptance-version-only.yml'
      - '.github/workflows/mail-acceptance-uploader-review.yml'
      - 'tools/comms-acceptance-upload.mjs'
      - 'tests/comms-acceptance-upload.test.mjs'
permissions:
  contents: read
concurrency:
  group: ds011-mail-uploader-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check the trusted uploader
        run: node --check tools/comms-acceptance-upload.mjs
      - name: Test upload boundaries with synthetic inputs only
        run: node --test tests/comms-acceptance-upload.test.mjs
