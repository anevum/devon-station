name: Synthetic foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm --prefix foundation test
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix foundation --no-save --ignore-scripts --no-audit --no-fund --package-lock=false playwright@1.62.1 @axe-core/playwright@4.10.2
      - run: node browser/preview-check.cjs
        working-directory: foundation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-preview-browser-results
          path: foundation/browser-results/
          if-no-files-found: ignore
  access-interop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout synthetic scope bridge
        uses: actions/checkout@v4
        with:
          path: scoped
          persist-credentials: false
      - name: Checkout pinned recovered verifier (separate draft)
        uses: actions/checkout@v4
        with:
          ref: 5c93f2315cafff16d63668938293e526ef5d9140
          path: recovered
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify synthetic JWT and scope bridge integration
        working-directory: scoped/foundation
        env:
          RECOVERED_ACCESS_MODULE: ../../recovered/worker/access.mjs
        run: node --test interop/access-scope-interop.mjs
